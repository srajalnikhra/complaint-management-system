name: Go CI

# Run this workflow whenever code is pushed
# or when a Pull Request is created.
on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # Step 1: Download your repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Step 3: Cache downloaded Go modules
      # This makes future workflow runs much faster.
      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Step 4: Download dependencies
      - name: Download Dependencies
        run: go mod download

      # Step 5: Check for common coding mistakes
      - name: Run go vet
        run: go vet ./...

      # Step 6: Run all unit tests
      - name: Run Tests
        run: go test ./...

      # Step 7: Build the application
      - name: Build Project
        run: go build -v ./...