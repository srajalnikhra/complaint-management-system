basePath: /
definitions:
  dto.CreateComplaintRequest:
    properties:
      description:
        type: string
      title:
        type: string
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.RegisterUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  dto.ResetPasswordRequest:
    properties:
      email:
        type: string
      new_password:
        type: string
      otp:
        type: string
    type: object
  dto.UpdateComplaintRequest:
    properties:
      description:
        type: string
      title:
        type: string
    type: object
  dto.UpdateComplaintStatusRequest:
    properties:
      status:
        type: string
    type: object
  dto.UpdateUserRoleRequest:
    properties:
      role:
        type: string
    type: object
  dto.UpdateUserStatusRequest:
    properties:
      is_active:
        type: boolean
    type: object
  dto.VerifyOTPRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    type: object
  utils.APIResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: Complaint Management System Backend API
  title: Complaint Management System API
  version: "1.0"
paths:
  /admin/complaints:
    get:
      description: Get all complaints with pagination, filtering and sorting (Admin
        only)
      parameters:
      - description: Page Number
        in: query
        name: page
        type: integer
      - description: Items Per Page
        in: query
        name: limit
        type: integer
      - description: Search by title
        in: query
        name: search
        type: string
      - description: Complaint Status
        in: query
        name: status
        type: string
      - description: Sort Field
        in: query
        name: sort
        type: string
      - description: ASC or DESC
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get All Complaints
      tags:
      - Admin
  /admin/complaints/{id}/status:
    patch:
      consumes:
      - application/json
      description: Update complaint status (Admin only)
      parameters:
      - description: Complaint ID
        in: path
        name: id
        required: true
        type: integer
      - description: Status
        in: body
        name: request
        required: true
        schema:
